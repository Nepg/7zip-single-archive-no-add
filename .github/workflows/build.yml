name: Build 7-Zip

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build 7z.dll
        shell: cmd
        run: |
          cd CPP\7zip\Bundles\Format7zF
          nmake PLATFORM=x64

      - name: Build 7-zip.dll
        shell: cmd
        run: |
          cd CPP\7zip\UI\Explorer
          nmake PLATFORM=x64

      - name: Collect outputs
        shell: cmd
        run: |
          mkdir out
          copy CPP\7zip\Bundles\Format7zF\x64\7z.dll out\ 2>nul || echo "7z.dll not found"
          copy CPP\7zip\UI\Explorer\x64\7-zip.dll out\ 2>nul || echo "7-zip.dll not found"
          dir out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-x64
          path: out/
          if-no-files-found: warn
